name: .NET 8.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.x

    - name: Restore
      run: dotnet restore RhoLoader/RhoLoader.csproj

    - name: Build
      run: dotnet build -c Release RhoLoader/RhoLoader.csproj

    - name: Publish
      run: dotnet publish -p:PublishProfile="RhoLoader/Properties/PublishProfiles/x64 version.pubxml" -o PublishedWinExe -c Release RhoLoader/RhoLoader.csproj

    - name: Get current date
      id: date
      run: echo "date=$(date +%y%m%d)" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Releases
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.date.outputs.date }}
        name: RhoLoader
        artifacts: "PublishedWinExe"
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}